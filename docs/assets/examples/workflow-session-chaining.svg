  <!-- Header -->
  <rect x="42" y="30" width="260" height="26" rx="5" fill="#071936" stroke="#00e5ff" stroke-width="1.3" />
  <text x="172" y="47" text-anchor="middle" class="f-mono" font-size="11.5" font-weight="700" fill="#00e5ff" letter-spacing="1.2">EXAMPLE 03 // CONTEXT GUARD</text>
  <text x="320" y="49" class="f-sans" font-size="22.5" font-weight="800" fill="#f0f6fc" letter-spacing="0.4">Periodic Cadence Hooks &amp; 5-Step Lossless Session Chaining</text>
  <text x="42" y="77" class="f-mono" font-size="13" fill="#94a3b8">Automated turn/step cadence reminders, PreCompact blocking, and zero-loss multi-session chaining</text>
  <line x1="42" y1="92" x2="1158" y2="92" stroke="url(#cyan-beam)" stroke-width="1.5" />

  <!-- Body Content -->
  <rect x="56" y="122" width="204" height="196" rx="10" fill="url(#panel-grad)" stroke="#00e5ff" stroke-width="1.8" />
  <text x="74" y="150" class="f-mono" font-size="11.5" font-weight="700" fill="#00e5ff">STEP 1</text>
  <text x="74" y="176" class="f-sans" font-size="17" font-weight="800" fill="#f0f6fc">CHECKPOINT</text>
  <line x1="74" y1="190" x2="242" y2="190" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
  <text x="74" y="220" class="f-mono" font-size="11.8" fill="#e2e8f0">Write verified state</text>
  <text x="74" y="242" class="f-mono" font-size="11.8" fill="#e2e8f0">to docs/CHECKPOINT.md</text>
  <text x="74" y="264" class="f-mono" font-size="11.8" fill="#e2e8f0">every 12 turns / 25 steps</text>
  <text x="74" y="286" class="f-mono" font-size="11.8" fill="#e2e8f0">or at 70% context cap</text>
  <line x1="260" y1="220" x2="276" y2="220" stroke="#00e5ff" stroke-width="2.2" />
  <polygon points="271,215 278,220 271,225" fill="#00ff9d" />
  <rect x="276" y="122" width="204" height="196" rx="10" fill="url(#panel-grad)" stroke="#00ff9d" stroke-width="1.8" />
  <text x="294" y="150" class="f-mono" font-size="11.5" font-weight="700" fill="#00ff9d">STEP 2</text>
  <text x="294" y="176" class="f-sans" font-size="17" font-weight="800" fill="#f0f6fc">PRECOMPACT</text>
  <line x1="294" y1="190" x2="462" y2="190" stroke="#00ff9d" stroke-width="1" stroke-opacity="0.5" />
  <text x="294" y="220" class="f-mono" font-size="11.8" fill="#e2e8f0">context_guard.py checks</text>
  <text x="294" y="242" class="f-mono" font-size="11.8" fill="#e2e8f0">checkpoint age &lt; 20m;</text>
  <text x="294" y="264" class="f-mono" font-size="11.8" fill="#e2e8f0">blocks unsafe /compact</text>
  <text x="294" y="286" class="f-mono" font-size="11.8" fill="#e2e8f0">(exit code 2 if stale)</text>
  <line x1="480" y1="220" x2="496" y2="220" stroke="#00e5ff" stroke-width="2.2" />
  <polygon points="491,215 498,220 491,225" fill="#00ff9d" />
  <rect x="496" y="122" width="204" height="196" rx="10" fill="url(#panel-grad)" stroke="#38bdf8" stroke-width="1.8" />
  <text x="514" y="150" class="f-mono" font-size="11.5" font-weight="700" fill="#38bdf8">STEP 3</text>
  <text x="514" y="176" class="f-sans" font-size="17" font-weight="800" fill="#f0f6fc">COMPACT</text>
  <line x1="514" y1="190" x2="682" y2="190" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
  <text x="514" y="220" class="f-mono" font-size="11.8" fill="#e2e8f0">Run /compact with</text>
  <text x="514" y="242" class="f-mono" font-size="11.8" fill="#e2e8f0">focus notes keeping</text>
  <text x="514" y="264" class="f-mono" font-size="11.8" fill="#e2e8f0">goal, decisions, diffs</text>
  <text x="514" y="286" class="f-mono" font-size="11.8" fill="#e2e8f0">&amp; next verify command</text>
  <line x1="700" y1="220" x2="716" y2="220" stroke="#00e5ff" stroke-width="2.2" />
  <polygon points="711,215 718,220 711,225" fill="#00ff9d" />
  <rect x="716" y="122" width="204" height="196" rx="10" fill="url(#panel-grad)" stroke="#a855f7" stroke-width="1.8" />
  <text x="734" y="150" class="f-mono" font-size="11.5" font-weight="700" fill="#a855f7">STEP 4</text>
  <text x="734" y="176" class="f-sans" font-size="17" font-weight="800" fill="#f0f6fc">HANDOFF</text>
  <line x1="734" y1="190" x2="902" y2="190" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
  <text x="734" y="220" class="f-mono" font-size="11.8" fill="#e2e8f0">Write docs/HANDOFF.md</text>
  <text x="734" y="242" class="f-mono" font-size="11.8" fill="#e2e8f0">with dead-ends, lessons</text>
  <text x="734" y="264" class="f-mono" font-size="11.8" fill="#e2e8f0">&amp; exact next command</text>
  <text x="734" y="286" class="f-mono" font-size="11.8" fill="#e2e8f0">then /clear or /exit</text>
  <line x1="920" y1="220" x2="936" y2="220" stroke="#00e5ff" stroke-width="2.2" />
  <polygon points="931,215 938,220 931,225" fill="#00ff9d" />
  <rect x="936" y="122" width="204" height="196" rx="10" fill="url(#panel-grad)" stroke="#00ff9d" stroke-width="1.8" />
  <text x="954" y="150" class="f-mono" font-size="11.5" font-weight="700" fill="#00ff9d">STEP 5</text>
  <text x="954" y="176" class="f-sans" font-size="17" font-weight="800" fill="#f0f6fc">AUTO-RESUME</text>
  <line x1="954" y1="190" x2="1122" y2="190" stroke="#00ff9d" stroke-width="1" stroke-opacity="0.5" />
  <text x="954" y="220" class="f-mono" font-size="11.8" fill="#e2e8f0">SessionStart hook or</text>
  <text x="954" y="242" class="f-mono" font-size="11.8" fill="#e2e8f0">chain-session.sh injects</text>
  <text x="954" y="264" class="f-mono" font-size="11.8" fill="#e2e8f0">checkpoint &amp; verifies</text>
  <text x="954" y="286" class="f-mono" font-size="11.8" fill="#e2e8f0">git status before edits</text>
  <!-- Dual Trigger Telemetry Panel -->
  <rect x="56" y="346" width="1084" height="190" rx="10" fill="url(#panel-grad)" stroke="#00e5ff" stroke-width="1.8" />
