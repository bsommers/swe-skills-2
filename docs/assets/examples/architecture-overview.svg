  <!-- Header -->
  <rect x="42" y="30" width="170" height="26" rx="5" fill="#071936" stroke="#00e5ff" stroke-width="1.3" />
  <text x="127" y="47" text-anchor="middle" class="f-mono" font-size="11.5" font-weight="700" fill="#00e5ff" letter-spacing="1.2">ARCHITECTURE</text>
  <text x="230" y="49" class="f-sans" font-size="22.5" font-weight="800" fill="#f0f6fc" letter-spacing="0.4">5-Tier Runtime Engineering Governance Architecture</text>
  <text x="42" y="77" class="f-mono" font-size="13" fill="#94a3b8">Ambient control plane across Claude Code, Antigravity (agy), and Cursor — 69 modular skills + lifecycle guards</text>
  <line x1="42" y1="92" x2="1158" y2="92" stroke="url(#cyan-beam)" stroke-width="1.5" />

  <!-- Body Content -->
  <rect x="64" y="110" width="1072" height="72" rx="8" fill="url(#panel-grad)" stroke="#00e5ff" stroke-width="1.8" />  <rect x="64" y="110" width="8" height="72" rx="4" fill="#00e5ff" />  <text x="90" y="134" class="f-mono" font-size="14" font-weight="700" fill="#00e5ff">TIER 1 // HARNESS INTEGRATION LAYER</text>  <text x="90" y="155" class="f-mono" font-size="12.5" fill="#f0f6fc">Claude Code (~/.claude/skills)   •   Antigravity (plugin.json + hooks.json)   •   Cursor (~/.cursor/skills + .mdc)   •   ~/.agents/skills</text>  <text x="90" y="173" class="f-sans" font-size="12.5" fill="#94a3b8">Zero-fork multi-runtime adapters &amp; profile-based surfacing (--profile core|build|review|ship|all)</text>
  <line x1="600" y1="182" x2="600" y2="198" stroke="#00e5ff" stroke-width="2" />  <polygon points="594,193 606,193 600,199" fill="#00ff9d" />
  <rect x="64" y="198" width="1072" height="72" rx="8" fill="url(#panel-grad)" stroke="#38bdf8" stroke-width="1.8" />  <rect x="64" y="198" width="8" height="72" rx="4" fill="#38bdf8" />  <text x="90" y="222" class="f-mono" font-size="14" font-weight="700" fill="#38bdf8">TIER 2 // LIFECYCLE HOOKS &amp; CONTEXT GUARDS (scripts/hooks/)</text>  <text x="90" y="243" class="f-mono" font-size="12.5" fill="#f0f6fc">context_guard.py (70% / 50-step / 12-turn cadence / 30m idle cache / PreCompact block)   •   model_router.py   •   git_pre_commit.py</text>  <text x="90" y="261" class="f-sans" font-size="12.5" fill="#94a3b8">Deterministic Python stdlib interceptors protecting context windows, model budgets &amp; git history</text>
  <line x1="600" y1="270" x2="600" y2="286" stroke="#00e5ff" stroke-width="2" />  <polygon points="594,281 606,281 600,287" fill="#00ff9d" />
  <rect x="64" y="286" width="1072" height="72" rx="8" fill="url(#panel-grad)" stroke="#00ff9d" stroke-width="1.8" />  <rect x="64" y="286" width="8" height="72" rx="4" fill="#00ff9d" />  <text x="90" y="310" class="f-mono" font-size="14" font-weight="700" fill="#00ff9d">TIER 3 // TASK SIZING &amp; /eng ROUTING ENGINE</text>  <text x="90" y="331" class="f-mono" font-size="12.5" fill="#f0f6fc">Scale Classifier (Tool &lt;=1d  |  App days  |  System multi-service)   -&gt;   Bounded Active Set (1-3 skills max, phase eviction)</text>  <text x="90" y="349" class="f-sans" font-size="12.5" fill="#94a3b8">Eliminates prompt replay bloat by loading only active-phase domain judgment</text>
  <line x1="600" y1="358" x2="600" y2="374" stroke="#00e5ff" stroke-width="2" />  <polygon points="594,369 606,369 600,375" fill="#00ff9d" />
  <rect x="64" y="374" width="1072" height="72" rx="8" fill="url(#panel-grad)" stroke="#00e5ff" stroke-width="1.8" />  <rect x="64" y="374" width="8" height="72" rx="4" fill="#00e5ff" />  <text x="90" y="398" class="f-mono" font-size="14" font-weight="700" fill="#00e5ff">TIER 4 // EVIDENCE-DERIVED DOMAIN SKILL LIBRARY (69 SKILLS)</text>  <text x="90" y="419" class="f-mono" font-size="12.5" fill="#f0f6fc">Frame &amp; Plan (9)  •  Architecture &amp; Tri-OS Drivers (12)  •  AI Loops (2)  •  Build &amp; Local CI (14)  •  Verify &amp; Browser QA (9)  •  Sustain &amp; Docs (20)</text>  <text x="90" y="437" class="f-sans" font-size="12.5" fill="#94a3b8">Distilled from concrete post-mortems across 20+ production repositories (&lt;=500-word target per skill)</text>
  <line x1="600" y1="446" x2="600" y2="462" stroke="#00e5ff" stroke-width="2" />  <polygon points="594,457 606,457 600,463" fill="#00ff9d" />
  <rect x="64" y="462" width="1072" height="72" rx="8" fill="url(#panel-grad)" stroke="#a855f7" stroke-width="1.8" />  <rect x="64" y="462" width="8" height="72" rx="4" fill="#a855f7" />  <text x="90" y="486" class="f-mono" font-size="14" font-weight="700" fill="#a855f7">TIER 5 // SUBAGENT LOG ISOLATION &amp; HIERARCHICAL VERIFICATION</text>  <text x="90" y="507" class="f-mono" font-size="12.5" fill="#f0f6fc">Primary Orchestrator (pro / Sonnet)  --delegates noisy build/test loops--&gt;  Ephemeral Worker (flash / Haiku)  +  scripts/verify.sh (8 tiers)</text>  <text x="90" y="525" class="f-sans" font-size="12.5" fill="#94a3b8">Quarantines compiler/test stdout inside throwaway workers; returns &lt;=10-line verified diff summary</text>

  <!-- Footer Telemetry -->
